name: Mac build

# Builds the Apple Silicon app on every push to main and publishes it as the
# rolling `latest` pre-release. scripts/install-mac.sh installs it from there.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      ASSET: anagnost-macos-arm64.dmg
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The self-signed certificate is not trusted by the runner, so
      # `find-identity -v` would hide it. Sign with its SHA-1 hash instead.
      # A stable certificate keeps macOS privacy grants across updates.
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::APPLE_CERTIFICATE secret is missing (see BUILD.md)"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No timeout: a cold build outlasts any auto-lock interval.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          HASH=$(security find-identity -p codesigning "$KEYCHAIN" \
            | grep -F "\"$APPLE_SIGNING_IDENTITY\"" | head -1 | awk '{print $2}')
          if [ -z "$HASH" ]; then
            echo "::error::No code signing identity named \"$APPLE_SIGNING_IDENTITY\" in the certificate"
            security find-identity -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$HASH" >> "$GITHUB_ENV"

      # Lets the install script tell which commit is installed.
      - name: Stamp commit into Info.plist
        run: /usr/libexec/PlistBuddy -c "Add :AnagnostCommit string $GITHUB_SHA" src-tauri/Info.plist

      - name: Build app
        run: bun run tauri build --bundles app,dmg

      - name: Verify signature
        run: |
          APP=$(echo src-tauri/target/release/bundle/macos/*.app)
          codesign --verify --deep --strict "$APP"
          codesign -dr - "$APP"

      # latest.txt tells the install script the commit and the app bundle
      # name without needing the GitHub API.
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src-tauri/target/release/bundle/dmg/*.dmg "$RUNNER_TEMP/$ASSET"
          APP=$(echo src-tauri/target/release/bundle/macos/*.app)
          printf '%s\n%s\n' "$GITHUB_SHA" "$(basename "$APP")" > "$RUNNER_TEMP/latest.txt"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/latest.txt" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Built from $GITHUB_SHA. Install or update with scripts/install-mac.sh (see BUILD.md)."
