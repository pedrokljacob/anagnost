name: CI

# Runs the Linux test bench (see BUILD.md) on every push and pull request.
# On main it then builds the Apple Silicon app and publishes it as the
# rolling `latest` pre-release; scripts/install-mac.sh installs it from there.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Superseded runs are cancelled, except on main, where a cancel could stop
# the publish step halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Linux tests
    # Branches in this repository are already tested on push; pull requests
    # only add runs for forks.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false

      # Same list as BUILD.md, "Linux test bench".
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev libevdev-dev libasound2-dev \
            pkg-config libssl-dev libvulkan-dev vulkan-tools glslc spirv-headers \
            glslang-tools libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf cmake xvfb

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Also produces dist/, which the Rust crate embeds.
      - name: Build frontend
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Test keyboard utilities
        run: bun run test:keyboard

      - name: Check model languages
        run: bun run check:model-languages

      - name: Test Rust crate
        working-directory: src-tauri
        run: cargo test

  build:
    name: Mac build
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      ASSET: anagnost-macos-arm64.dmg
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The self-signed certificate is not trusted by the runner, so
      # `find-identity -v` would hide it. Sign with its SHA-1 hash instead.
      # A stable certificate keeps macOS privacy grants across updates.
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::APPLE_CERTIFICATE secret is missing (see BUILD.md)"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No timeout: a cold build outlasts any auto-lock interval.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          HASH=$(security find-identity -p codesigning "$KEYCHAIN" \
            | grep -F "\"$APPLE_SIGNING_IDENTITY\"" | head -1 | awk '{print $2}')
          if [ -z "$HASH" ]; then
            echo "::error::No code signing identity named \"$APPLE_SIGNING_IDENTITY\" in the certificate"
            security find-identity -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$HASH" >> "$GITHUB_ENV"

      # Lets the install script tell which commit is installed.
      - name: Stamp commit into Info.plist
        run: /usr/libexec/PlistBuddy -c "Add :AnagnostCommit string $GITHUB_SHA" src-tauri/Info.plist

      - name: Build app
        run: bun run tauri build --bundles app,dmg

      - name: Verify signature
        run: |
          APP=$(echo src-tauri/target/release/bundle/macos/*.app)
          codesign --verify --deep --strict "$APP"
          codesign -dr - "$APP"

      # latest.txt tells the install script the commit and the app bundle
      # name without needing the GitHub API. The release is updated in
      # place, never deleted, so the download URLs keep working throughout;
      # latest.txt goes last so it never names a build not yet uploaded.
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src-tauri/target/release/bundle/dmg/*.dmg "$RUNNER_TEMP/$ASSET"
          APP=$(echo src-tauri/target/release/bundle/macos/*.app)
          printf '%s\n%s\n' "$GITHUB_SHA" "$(basename "$APP")" > "$RUNNER_TEMP/latest.txt"
          TITLE="Latest build (${GITHUB_SHA::7})"
          NOTES="Built from $GITHUB_SHA. Install or update with scripts/install-mac.sh (see BUILD.md)."
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --prerelease --target "$GITHUB_SHA" \
              --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload latest "$RUNNER_TEMP/$ASSET" --clobber
          gh release upload latest "$RUNNER_TEMP/latest.txt" --clobber
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null \
            || gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/latest -f sha="$GITHUB_SHA" >/dev/null
          gh release edit latest --prerelease --title "$TITLE" --notes "$NOTES"
