name: CI

# Runs the Linux test bench (see BUILD.md) on every push and pull request:
# the frontend checks and the Rust tests as two parallel jobs. On main it
# then builds the Apple Silicon app and publishes it as the rolling
# `latest` pre-release; scripts/install-mac.sh installs it from there.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Superseded runs are cancelled, except on main, where a cancel could stop
# the publish step halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Frontend checks
    # Branches in this repository are already tested on push; pull requests
    # only add runs for forks.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bunx prettier --check .

      - name: Unit tests
        run: bun run test

      - name: Decision guards
        run: bun run check:decisions

      - name: Check model languages
        run: bun run check:model-languages

      # WebKit is the closest match to the Mac's WKWebView. The browser is
      # cached by Playwright version; only its system libraries are
      # installed on every run.
      - name: Playwright version
        id: playwright
        run: echo "version=$(bun pm ls 2>/dev/null | grep -o '@playwright/test@[0-9.]*' | head -1 | cut -d@ -f3)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ steps.playwright.outputs.version }}

      - name: Install WebKit
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: bunx playwright install webkit

      - name: Install WebKit system libraries
        run: bunx playwright install-deps webkit

      - name: UI contract tests
        run: bun run test:ui

  test:
    name: Rust tests
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
          # Branch runs reuse main's cache; only main refreshes it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The BUILD.md "Linux test bench" list minus what only an AppImage
      # (patchelf) or a human (vulkan-tools) needs; xvfb runs the headless
      # binary for the bindings check.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev libevdev-dev libasound2-dev \
            pkg-config libssl-dev libvulkan-dev glslc spirv-headers \
            glslang-tools libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev cmake xvfb

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Also produces dist/, which the Rust crate embeds.
      - name: Build frontend
        run: bun run build

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Test Rust crate
        working-directory: src-tauri
        run: cargo test

      # A debug build rewrites src/bindings.ts when it starts. Running the
      # headless binary once shows whether the committed file matches the
      # Rust commands and types. The only expected difference on Linux is
      # the doc comment of isLaptop (see BUILD.md), which the -I patterns
      # ignore.
      - name: Check generated bindings
        working-directory: src-tauri
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/xdg/data
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg/config
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg/cache
        run: |
          LD_LIBRARY_PATH=$PWD/transcribe-libs xvfb-run -a cargo run -- --list-models >/dev/null
          git diff --exit-code -I 'laptop|battery|pmset|macOS' -I '^\s*\*\s*$' ../src/bindings.ts \
            || { echo "::error::src/bindings.ts is out of date; run the app once in debug and commit it"; exit 1; }

  build:
    name: Mac build
    needs: [checks, test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      ASSET: anagnost-macos-arm64.dmg
      # Fails the build when the disk image grows past this. Raise it on
      # purpose, with the reason in the commit; see BUILD.md, "Build size".
      SIZE_BUDGET_MB: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # A push that only touches documentation would rebuild and republish
      # an identical app. Skip the rest of the job; `latest` then keeps
      # pointing at the last build that changed the app. Forced pushes and
      # merges with more than one parent are always built.
      - name: Check for app changes
        id: changes
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] \
            || [ "${{ github.event.forced }}" = "true" ] \
            || ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.before }}" "$GITHUB_SHA")
          if [ -z "$changed" ] \
            || echo "$changed" | grep -qvE '(^|/)[^/]+\.md$|^LICENSE$|^\.gitignore$|^\.prettierignore$|^\.prettierrc$|^\.vscode/'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed; skipping the Mac build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.changes.outputs.build == 'true'

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        if: steps.changes.outputs.build == 'true'
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changes.outputs.build == 'true'
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        if: steps.changes.outputs.build == 'true'
        run: bun install --frozen-lockfile

      # The self-signed certificate is not trusted by the runner, so
      # `find-identity -v` would hide it. Sign with its SHA-1 hash instead.
      # A stable certificate keeps macOS privacy grants across updates.
      - name: Import signing certificate
        if: steps.changes.outputs.build == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::APPLE_CERTIFICATE secret is missing (see BUILD.md)"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No timeout: a cold build outlasts any auto-lock interval.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          HASH=$(security find-identity -p codesigning "$KEYCHAIN" \
            | grep -F "\"$APPLE_SIGNING_IDENTITY\"" | head -1 | awk '{print $2}')
          if [ -z "$HASH" ]; then
            echo "::error::No code signing identity named \"$APPLE_SIGNING_IDENTITY\" in the certificate"
            security find-identity -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$HASH" >> "$GITHUB_ENV"

      # Lets the install script tell which commit is installed.
      - name: Stamp commit into Info.plist
        if: steps.changes.outputs.build == 'true'
        run: /usr/libexec/PlistBuddy -c "Add :AnagnostCommit string $GITHUB_SHA" src-tauri/Info.plist

      - name: Build app
        if: steps.changes.outputs.build == 'true'
        run: bun run tauri build --bundles app,dmg

      - name: Verify signature
        if: steps.changes.outputs.build == 'true'
        run: |
          APP=$(echo src-tauri/target/release/bundle/macos/*.app)
          codesign --verify --deep --strict "$APP"
          codesign -dr - "$APP"

      - name: Check build size
        if: steps.changes.outputs.build == 'true'
        run: |
          DMG=$(echo src-tauri/target/release/bundle/dmg/*.dmg)
          size=$(stat -f %z "$DMG")
          echo "Disk image: $((size / 1024 / 1024)) MB (budget $SIZE_BUDGET_MB MB)"
          if [ "$size" -gt $((SIZE_BUDGET_MB * 1024 * 1024)) ]; then
            echo "::error::The disk image is over the $SIZE_BUDGET_MB MB budget"
            exit 1
          fi

      # latest.txt tells the install script the commit and the app bundle
      # name without needing the GitHub API. The release is updated in
      # place, never deleted, so the download URLs keep working throughout;
      # latest.txt goes last so it never names a build not yet uploaded.
      - name: Publish rolling release
        if: steps.changes.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src-tauri/target/release/bundle/dmg/*.dmg "$RUNNER_TEMP/$ASSET"
          APP=$(echo src-tauri/target/release/bundle/macos/*.app)
          printf '%s\n%s\n' "$GITHUB_SHA" "$(basename "$APP")" > "$RUNNER_TEMP/latest.txt"
          TITLE="Latest build (${GITHUB_SHA::7})"
          NOTES="Built from $GITHUB_SHA. Install or update with scripts/install-mac.sh (see BUILD.md)."
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --prerelease --target "$GITHUB_SHA" \
              --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload latest "$RUNNER_TEMP/$ASSET" --clobber
          gh release upload latest "$RUNNER_TEMP/latest.txt" --clobber
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null \
            || gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/latest -f sha="$GITHUB_SHA" >/dev/null
          gh release edit latest --prerelease --title "$TITLE" --notes "$NOTES"
